services:
  mysql:
    image: mysql:8.0
    container_name: infomed_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: infomed_root
      MYSQL_DATABASE: infomed
      MYSQL_USER: user_infomed
      MYSQL_PASSWORD: password_infomed
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - infomed-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - infomed-network

  agendamento-service:
    build:
      context: .
      dockerfile: agendamento-service/Dockerfile
    container_name: agendamento_service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/infomed?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: user_infomed
      SPRING_DATASOURCE_PASSWORD: password_infomed
      SPRING_DATASOURCE_PORT: 3306
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - infomed-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification_service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/infomed?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: user_infomed
      SPRING_DATASOURCE_PASSWORD: password_infomed
      SPRING_DATASOURCE_PORT: 3306
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - infomed-network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  infomed-network:
    driver: bridge